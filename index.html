<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to PDF Professional Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap');

        .markdown-body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }
        .markdown-body h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; }
        .markdown-body h2 { font-size: 1.75rem; font-weight: 600; margin-top: 2rem; margin-bottom: 1rem; }
        .markdown-body p { margin-bottom: 1.25rem; }
        .markdown-body code { background: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .markdown-body pre { background: #1e293b; color: #f8fafc; padding: 1.25rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1.5rem; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.25rem; }
        .markdown-body blockquote { border-left: 4px solid #cbd5e1; padding-left: 1rem; font-style: italic; color: #475569; margin-bottom: 1.25rem; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-[Inter]">

    <div class="max-w-6xl mx-auto px-4 py-12">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-slate-800 mb-2 text-balance">Markdown to PDF</h1>
            <p class="text-slate-500">Upload a file or start typing to generate a professional document.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Input -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-slate-700">Editor</h2>
                    <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition font-semibold shadow-sm">
                        Open .md File
                        <input type="file" id="fileInput" class="hidden" accept=".md,.txt">
                    </label>
                </div>
                
                <textarea id="editor" class="w-full h-[600px] p-5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none font-mono text-sm leading-relaxed" placeholder="Start typing your markdown..."></textarea>
            </div>

            <!-- Preview -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-slate-700">Preview</h2>
                    <button id="downloadBtn" class="bg-slate-900 hover:bg-black text-white px-6 py-2 rounded-lg text-sm transition font-semibold flex items-center gap-2 shadow-lg active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        Generate PDF
                    </button>
                </div>
                
                <div id="preview" class="markdown-body w-full h-[600px] p-8 bg-white border border-slate-200 rounded-xl overflow-y-auto">
                </div>
            </div>
        </div>
    </div>

    <div id="msgBox" class="fixed bottom-8 right-8 hidden bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl transition-all flex items-center gap-3">
        <span id="msgContent"></span>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const msgBox = document.getElementById('msgBox');

        function showMessage(text) {
            const content = document.getElementById('msgContent');
            if (content) content.innerText = text;
            msgBox.classList.remove('hidden');
            setTimeout(() => msgBox.classList.add('hidden'), 3000);
        }

        const updatePreview = () => {
            try {
                if (typeof marked !== 'undefined') {
                    preview.innerHTML = marked.parse(editor.value || '');
                }
            } catch (e) {
                console.error("Markdown parsing error", e);
            }
        };

        editor.addEventListener('input', updatePreview);

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            
            const file = files; // FIX: Access index 0 correctly
            const reader = new FileReader();
            reader.onload = (event) => {
                editor.value = event.target.result;
                updatePreview();
                showMessage(`"${file.name}" loaded successfully`);
            };
            reader.onerror = () => showMessage("Error reading file");
            reader.readAsText(file); 
        });

        downloadBtn.addEventListener('click', () => {
            const mdText = editor.value.trim();
            if (!mdText) {
                showMessage("Please add some content first!");
                return;
            }

            const titleMatch = mdText.match(/^#\s+(.*)$/m);
            const docTitle = (titleMatch && titleMatch) ? titleMatch : 'Document';

            const printWindow = window.open('', '_blank');
            if (!printWindow) {
                showMessage("Pop-up blocked! Please allow pop-ups to print.");
                return;
            }

            const htmlContent = marked.parse(mdText);

            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>\u200B</title>
                    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
                    <style>
                        @page {
                            size: A4;
                            margin: 20mm 15mm; /* FIX: Specific top/bottom and side margins */
                        }
                        
                        @media print {
                            html, body {
                                margin: 0;
                                padding: 0;
                            }
                            .markdown-body {
                                padding: 0 !important; /* Let @page handle the margins */
                            }
                        }

                        body { 
                            background: white !important;
                            font-family: 'Noto Serif', serif;
                            margin: 0;
                        }

                        .markdown-body {
                            font-family: 'Noto Serif', serif !important;
                            color: #1a1a1a;
                            line-height: 1.6;
                            font-size: 11pt;
                        }

                        .markdown-body h1 { 
                            font-family: 'Inter', sans-serif !important; 
                            border-bottom: 1px solid #eee;
                            margin-top: 0;
                        }
                    </style>
                </head>
                <body class="markdown-body">
                    ${htmlContent}
                    <script>
                        window.onload = () => {
                            setTimeout(() => {
                                window.print();
                            }, 500);
                        };
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        });

        updatePreview();
    </script>
</body>
</html>
